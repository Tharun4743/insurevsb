services:
  - type: web
    name: insure-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    plan: free
    autoDeploy: true
    envVars:
      - key: IOT_INGEST_API_KEY
        sync: false
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DEMO_USER_ID
        value: 00000000-0000-0000-0000-000000000001
      - key: CURRENCY
        value: INR
      - key: CURRENCY_SYMBOL
        value: "₹"
      - key: BASE_PREMIUM
        value: "2000"
      - key: MAX_RISK_ADJUSTMENT
        value: "0.5"
      - key: PRICING_RULE_VERSION
        value: v2.1-profitability
      - key: SCORE_RULE_VERSION
        value: v2.1-profitability
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: OTP_SALT
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        value: INSURE
      - key: GEMINI_API_KEY
        sync: false
